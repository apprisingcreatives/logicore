apiVersion: apps/v1
kind: Deployment
metadata:
  name: logicore-api
  namespace: production
  labels:
    app: logicore-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logicore-api
  template:
    metadata:
      labels:
        app: logicore-api
    spec:
      containers:
        - name: api
          image: logicore/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: logicore-production-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/dashboard/kpis
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/dashboard/kpis
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logicore-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logicore-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
